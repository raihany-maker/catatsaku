<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Catatsaku">
  <!-- Logo Catatsaku: saku (kantong) berisi catatan grafik, pensil, dan koin Rupiah. -->
  <rect width="512" height="512" rx="112" fill="#1A100D"/>
  <g transform="translate(256 259) scale(1.1) translate(-256 -259)">
    <!-- tab dompet di belakang kartu -->
    <path d="M258 107V93a16 16 0 0 1 16-16h51a16 16 0 0 1 16 16v14z" fill="#F4B820"/>
    <path d="M171 135V95a18 18 0 0 1 18-18h53a18 18 0 0 1 18 18v40z" fill="#3DA172" stroke="#1A100D" stroke-width="7"/>
    <!-- koin di belakang kartu -->
    <circle cx="359" cy="179" r="36" fill="#F4B820"/>
    <circle cx="359" cy="179" r="27" fill="none" stroke="#E0951A" stroke-width="3.5"/>
    <!-- kartu catatan -->
    <rect x="145" y="115" width="222" height="130" rx="14" fill="#F7F0E4"/>
    <!-- grafik naik -->
    <rect x="208" y="171" width="15" height="38" rx="2.5" fill="#3DA172"/>
    <rect x="231" y="181" width="15" height="28" rx="2.5" fill="#0E7A4E"/>
    <rect x="254" y="158" width="16" height="51" rx="2.5" fill="#F4B820"/>
    <polyline points="189,170 215,145 237,166 262,139" fill="none" stroke="#3DA172" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M273 127l-4.9 17.2-11.8-10.8z" fill="#3DA172" stroke="#3DA172" stroke-width="2" stroke-linejoin="round"/>
    <!-- pensil -->
    <g transform="translate(296 236) rotate(30)" stroke="#1A100D" stroke-width="7" stroke-linejoin="round">
      <rect x="-22" y="-72" width="44" height="90" fill="#DC5A0C"/>
      <path d="M-22-72h44l-15-30H-7z" fill="#F6A57C"/>
      <path d="M-7-102H7l-7 11z" fill="#1A100D"/>
    </g>
    <!-- koin Rupiah -->
    <circle cx="169" cy="202" r="37" fill="#F4B820"/>
    <circle cx="169" cy="202" r="28.5" fill="none" stroke="#E07413" stroke-width="3.5"/>
    <text x="169" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" fill="#D9620C">Rp</text>
    <!-- saku -->
    <path d="M130 212L230 228Q256 232 282 228L382 212Q395 210 395 224V379Q395 398 377 405L268 437Q256 441 244 437L135 405Q118 398 118 379V224Q118 210 130 212Z" fill="#F26B11"/>
    <path d="M118 244L232 268Q256 274 280 268L395 244" fill="none" stroke="#C9520A" stroke-width="6"/>
    <path d="M135 270V370Q135 388 152 394L244 423Q256 427 268 423L360 394Q377 388 377 370V270" fill="none" stroke="#C9520A" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="20 19"/>
  </g>
</svg>
