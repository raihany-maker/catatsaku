  <!-- Tema dipasang SEBELUM render pertama (tanpa kedipan). -->
  <script>
    (function () {
      var m = 'sistem';
      try { m = localStorage.getItem('cs_tema') || 'sistem'; } catch (e) {}
      var gelap = m === 'gelap' || (m === 'sistem' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
      document.documentElement.setAttribute('data-theme', gelap ? 'dark' : 'light');
      document.querySelector('meta[name=theme-color]').setAttribute('content', gelap ? '#140D0A' : '#FAF6F2');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
